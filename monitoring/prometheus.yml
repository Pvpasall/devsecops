global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
    metrics_path: '/api/health'
    scrape_interval: 30s

  - job_name: 'payment-service'
    static_configs:
      - targets: ['payment-service:4000']
    metrics_path: '/api/health'
    scrape_interval: 30s

  - job_name: 'admin-dashboard'
    static_configs:
      - targets: ['admin-dashboard:3000']
    metrics_path: '/health'
    scrape_interval: 30s

  - job_name: 'frontend'
    static_configs:
      - targets: ['frontend-app:80']
    metrics_path: '/health'
    scrape_interval: 30s 