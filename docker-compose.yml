version: '3.8'

services:
  # Reverse Proxy (Nginx)
  reverse-proxy:
    image: nginx:alpine
    container_name: reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend-app
      - api-gateway
      - payment-service
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Application 1: Frontend Static HTML/CSS/JS
  frontend-app:
    build: ./frontend
    container_name: frontend-app
    expose:
      - "80"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Application 2: API Gateway (Node.js/Express)
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - FRONTEND_URL=http://localhost
      - DATABASE_URL=mongodb://database:27017/gateway
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
    depends_on:
      - database
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - ./logs:/usr/src/app/logs
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Application 3: Payment Service (Node.js with Stripe)
  payment-service:
    build: ./payment-service
    container_name: payment-service
    expose:
      - "4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - DATABASE_URL=mongodb://database:27017/payments
    depends_on:
      - database
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - ./logs:/usr/src/app/logs
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Application 4: Admin Dashboard (Vulnerable for Pentesting)
  admin-dashboard:
    build: ./admin-dashboard
    container_name: admin-dashboard
    ports:
      - "8080:3000"  # Direct access for penetration testing
    environment:
      - NODE_ENV=development  # Intentionally development for vulnerabilities
      - PORT=3000
      - ADMIN_SECRET=${ADMIN_SECRET}
      - DATABASE_URL=mongodb://database:27017/admin
    depends_on:
      - database
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - ./logs:/usr/src/app/logs
      - ./admin-dashboard/uploads:/usr/src/app/uploads
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Database (MongoDB)
  database:
    image: mongo:6-jammy
    container_name: database
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Monitoring (Optional - Lightweight monitoring)
  monitoring:
    image: prom/prometheus:latest
    container_name: monitoring
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - app-network
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  mongodb_data:
    driver: local
  prometheus_data:
    driver: local 